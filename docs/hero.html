<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 400px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #0b1220 0%, #0f1c33 55%, #14284d 100%);
    color: #e8eef7;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; overflow: hidden; position: relative;
  }
  .ring { position: absolute; border-radius: 50%; border: 1px solid rgba(94,160,255,0.14); }
  .r1 { width: 460px; height: 460px; right: -140px; top: -160px; }
  .r2 { width: 460px; height: 460px; left: -140px; bottom: -200px; }
  .r3 { width: 220px; height: 220px; left: 90px; top: -70px; }
  h1 { font-size: 72px; font-weight: 700; letter-spacing: 1px; }
  h1 span { color: #5ea0ff; }
  .tagline { font-size: 24px; margin-top: 14px; color: #aebbd1; font-weight: 400; }
  .chips { margin-top: 34px; display: flex; gap: 12px; }
  .chip {
    font-size: 15px; color: #c8d6ee; padding: 8px 18px;
    border: 1px solid rgba(94,160,255,0.35); border-radius: 999px;
    background: rgba(94,160,255,0.08); letter-spacing: 0.3px;
  }
</style>
</head>
<body>
  <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
  <h1>Packet<span>Lens</span></h1>
  <p class="tagline">Drop a PCAP. Get a full security report &mdash; entirely on your machine.</p>
  <div class="chips">
    <span class="chip">22-section report</span>
    <span class="chip">Risk score 0&ndash;100</span>
    <span class="chip">Investigation graph</span>
    <span class="chip">Offline world map</span>
    <span class="chip">100% local</span>
  </div>
</body>
</html>
